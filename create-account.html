<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stackly</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card animate__animated animate__fadeInUp">
            <div class="auth-header">
                <a href="index.html" class="brand-link">
                    <img src="images/logoimg.webp" alt="Stackly Logo" class="brand-icon" width="50px" height="50px">
                    <span class="brand-text">STACKLY</span>
                </a>
                <h2 class="auth-title">Create Account</h2>
                <p class="auth-subtitle">Join us and start your digital journey</p>
            </div>

            <div class="login-type-selector mb-4">
                <button class="login-type-btn active" data-type="admin">
                    <i class="fas fa-user-shield"></i>
                    <span>Admin Account</span>
                </button>
                <button class="login-type-btn" data-type="client">
                    <i class="fas fa-user"></i>
                    <span>Client Account</span>
                </button>
            </div>

            <form id="signupForm" class="auth-form">
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="fullName" placeholder="John Doe" required>
                    <label for="fullName"><i class="fas fa-user me-2"></i>Full Name</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                    <label for="email"><i class="fas fa-envelope me-2"></i>Email address</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="password" class="form-control" id="password" placeholder="Password" required>
                    <label for="password"><i class="fas fa-lock me-2"></i>Password</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm Password" required>
                    <label for="confirmPassword"><i class="fas fa-lock me-2"></i>Confirm Password</label>
                </div>

                <div class="form-check mb-4">
                    <input class="form-check-input" type="checkbox" id="terms" required>
                    <label class="form-check-label" for="terms">
                        I agree to the <a href="404.html">Terms of Service</a> and <a href="404.html">Privacy Policy</a>
                    </label>
                </div>

                <button type="submit" class="btn btn-primary w-100 mb-3">
                    <span>Create Account</span>
                    <i class="fas fa-arrow-right ms-2"></i>
                </button>

                <div class="divider">
                    <span>OR</span>
                </div>

                <div class="social-login">
                    <button type="button" class="btn btn-social" onclick="window.location.href='404.html'">
                        <i class="fab fa-google"></i>
                        <span>Sign up with Google</span>
                    </button>
                    <button type="button" class="btn btn-social" onclick="window.location.href='404.html'">
                        <i class="fab fa-microsoft"></i>
                        <span>Sign up with Microsoft</span>
                    </button>
                </div>

                <p class="signup-link">
                    Already have an account? 
                    <a href="login.html">Sign In</a>
                </p>
            </form>
        </div>

        <div class="auth-footer">
            <a href="index.html"><i class="fas fa-arrow-left me-2"></i>Back to Home</a>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.0/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentAccountType = 'admin';

        // Account type selector
        document.querySelectorAll('.login-type-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.login-type-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentAccountType = this.getAttribute('data-type');
                
                const title = currentAccountType === 'admin' ? 'Admin Account' : 'Client Account';
                document.querySelector('.auth-subtitle').textContent = `Create your ${title.toLowerCase()}`;
            });
        });

        // Form submission
        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const fullName = document.getElementById('fullName').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const terms = document.getElementById('terms').checked;

            // Validate passwords match
            if (password !== confirmPassword) {
                alert('Passwords do not match!');
                return;
            }

            if (!terms) {
                alert('Please agree to the Terms of Service and Privacy Policy');
                return;
            }

            // Store account type in sessionStorage
            sessionStorage.setItem('loginType', currentAccountType);
            sessionStorage.setItem('userEmail', email);
            sessionStorage.setItem('userName', fullName);

            // Show success message and redirect
            alert('Account created successfully!');
            
            // Redirect to appropriate dashboard
            if (currentAccountType === 'admin') {
                window.location.href = 'admin-dashboard.html';
            } else {
                window.location.href = 'client-dashboard.html';
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stackly</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card animate__animated animate__fadeInUp">
            <div class="auth-header">
                <a href="index.html" class="brand-link">
                    <img src="images/logoimg.webp" alt="Stackly Logo" class="brand-icon" width="50px" height="50px">
                    <span class="brand-text">STACKLY</span>
                </a>
                <h2 class="auth-title">Welcome Back</h2>
                <p class="auth-subtitle">Choose your login type to continue</p>
            </div>

            <div class="login-type-selector mb-4">
                <button class="login-type-btn active" data-type="admin">
                    <i class="fas fa-user-shield"></i>
                    <span>Admin Login</span>
                </button>
                <button class="login-type-btn" data-type="client">
                    <i class="fas fa-user"></i>
                    <span>Client Login</span>
                </button>
            </div>

            <form id="loginForm" class="auth-form">
                <div class="form-floating mb-3">
                    <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                    <label for="email"><i class="fas fa-envelope me-2"></i>Email address</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="password" class="form-control" id="password" placeholder="Password" required>
                    <label for="password"><i class="fas fa-lock me-2"></i>Password</label>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="rememberMe">
                        <label class="form-check-label" for="rememberMe">
                            Remember me
                        </label>
                    </div>
                    <a href="404.html" class="forgot-password">Forgot Password?</a>
                </div>

                <button type="submit" class="btn btn-primary w-100 mb-3">
                    <span>Sign In</span>
                    <i class="fas fa-arrow-right ms-2"></i>
                </button>

                <div class="divider">
                    <span>OR</span>
                </div>

                <div class="social-login">
                    <button type="button" class="btn btn-social" onclick="window.location.href='404.html'">
                        <i class="fab fa-google"></i>
                        <span>Continue with Google</span>
                    </button>
                    <button type="button" class="btn btn-social" onclick="window.location.href='404.html'">
                        <i class="fab fa-microsoft"></i>
                        <span>Continue with Microsoft</span>
                    </button>
                </div>

                <p class="signup-link">
                    Don't have an account? 
                    <a href="create-account.html">Create Account</a>
                </p>
            </form>
        </div>

        <div class="auth-footer">
            <a href="index.html"><i class="fas fa-arrow-left me-2"></i>Back to Home</a>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.0/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentLoginType = 'admin';

        // Login type selector
        document.querySelectorAll('.login-type-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.login-type-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentLoginType = this.getAttribute('data-type');
                
                const title = currentLoginType === 'admin' ? 'Admin Login' : 'Client Login';
                document.querySelector('.auth-title').textContent = `Welcome Back - ${title}`;
            });
        });

        // Form submission
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Simple validation (in production, you'd validate against a backend)
            if (email && password) {
                // Store login type in sessionStorage
                sessionStorage.setItem('loginType', currentLoginType);
                sessionStorage.setItem('userEmail', email);

                // Redirect to appropriate dashboard
                if (currentLoginType === 'admin') {
                    window.location.href = 'admin-dashboard.html';
                } else {
                    window.location.href = 'client-dashboard.html';
                }
            }
        });

        // Demo credentials hint
        console.log('Demo Login - Use any email and password to test');
    </script>
</body>
</html>

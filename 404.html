<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stackly</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        .error-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }

        .error-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 50%, rgba(99, 102, 241, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(139, 92, 246, 0.1) 0%, transparent 50%);
        }

        .error-content {
            text-align: center;
            position: relative;
            z-index: 1;
            max-width: 600px;
        }

        .error-code {
            font-size: 10rem;
            font-weight: 900;
            background: var(--gradient-1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: 1rem;
            text-shadow: 0 0 100px rgba(99, 102, 241, 0.5);
        }

        .error-title {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--light-text);
            margin-bottom: 1rem;
        }

        .error-description {
            font-size: 1.25rem;
            color: var(--gray-text);
            margin-bottom: 3rem;
            line-height: 1.8;
        }

        .error-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .error-actions .btn {
            padding: 1rem 2rem;
            font-weight: 700;
            border-radius: 50px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .btn-primary {
            background: var(--gradient-1);
            border: none;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(99, 102, 241, 0.4);
        }

        .btn-outline-light {
            border: 2px solid var(--light-text);
            background: transparent;
            color: var(--light-text);
        }

        .btn-outline-light:hover {
            background: var(--light-text);
            color: var(--dark-bg);
            transform: translateY(-3px);
        }

        .floating-shapes {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .shape {
            position: absolute;
            opacity: 0.1;
        }

        .shape-1 {
            top: 10%;
            left: 10%;
            font-size: 5rem;
            color: var(--primary-color);
            animation: float 6s ease-in-out infinite;
        }

        .shape-2 {
            top: 70%;
            right: 10%;
            font-size: 4rem;
            color: var(--secondary-color);
            animation: float 8s ease-in-out infinite;
            animation-delay: 1s;
        }

        .shape-3 {
            bottom: 20%;
            left: 15%;
            font-size: 3rem;
            color: var(--accent-color);
            animation: float 7s ease-in-out infinite;
            animation-delay: 2s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(-20px) rotate(180deg);
            }
        }

        @media (max-width: 768px) {
            .error-code {
                font-size: 6rem;
            }

            .error-title {
                font-size: 2rem;
            }

            .error-description {
                font-size: 1rem;
            }

            .error-actions {
                flex-direction: column;
            }

            .error-actions .btn {
                width: 100%;
                justify-content: center;
            }
        }

        @media (max-width: 576px) {
            .error-code {
                font-size: 5rem;
            }

            .error-title {
                font-size: 1.75rem;
            }
        }

        @media (max-width: 320px) {
            .error-code {
                font-size: 4rem;
            }

            .error-title {
                font-size: 1.5rem;
            }

            .error-description {
                font-size: 0.875rem;
            }

            .error-actions .btn {
                padding: 0.75rem 1.5rem;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="floating-shapes">
            <i class="fas fa-circle shape shape-1"></i>
            <i class="fas fa-square shape shape-2"></i>
            <i class="fas fa-triangle shape shape-3"></i>
        </div>

        <div class="error-content animate__animated animate__fadeIn">
            <div class="error-code animate__animated animate__bounceIn">
                404
            </div>
            <h1 class="error-title animate__animated animate__fadeInUp animate__delay-1s">
                Page Not Found
            </h1>
            <p class="error-description animate__animated animate__fadeInUp animate__delay-2s">
                Oops! The page you're looking for doesn't exist or is under construction. 
                Let's get you back on track.
            </p>
            <div class="error-actions animate__animated animate__fadeInUp animate__delay-3s">
                <button class="btn btn-primary" onclick="goBack()">
                    <i class="fas fa-arrow-left"></i>
                    <span>Go Back</span>
                </button>
                <a href="index.html" class="btn btn-outline-light">
                    <i class="fas fa-home"></i>
                    <span>Home Page</span>
                </a>
            </div>
        </div>
    </div>

    <script>
        function goBack() {
            // Check if there's a previous page in history
            if (document.referrer && document.referrer !== '') {
                window.history.back();
            } else {
                // If no referrer, go to home page
                window.location.href = 'index.html';
            }
        }

        // Add keyboard navigation
        document.addEventListener('keydown', function(e) {
            // Press 'H' to go home
            if (e.key === 'h' || e.key === 'H') {
                window.location.href = 'index.html';
            }
            // Press 'Backspace' or 'Escape' to go back
            if (e.key === 'Backspace' || e.key === 'Escape') {
                goBack();
            }
        });

        // Auto-redirect after 30 seconds (optional)
        let countdown = 30;
        const autoRedirect = setInterval(function() {
            countdown--;
            if (countdown <= 0) {
                clearInterval(autoRedirect);
                goBack();
            }
        }, 1000);

        console.log('404 Page - Press H for Home, Backspace or Esc to go back');
    </script>
</body>
</html>
